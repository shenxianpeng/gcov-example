name: Cpp Linter

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: cpp-linter/cpp-linter-action@774040af57f011a5fc47911f08ff0c3059d1835a # v2.24.0
      id: linter
      with:
        style: 'LLVM'
        tidy-checks: '-*' # disable tidy check
        lines-changed-only: 'false'

    - name: Fail fast?!
      if: steps.linter.outputs.checks-failed > 0
      run: exit 1
